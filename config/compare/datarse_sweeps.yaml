# Sweep for the comparison of the rules selecting k* in dataRSE
# (run_all.sh). Smaller structural grid than datarse_sweeps.yaml, full
# range of sample sizes, since running time is studied as a function of n.
block_size:
    - 4
    - 8
relevant_size:
    - 2
    - 4
edge_ratio:
    - 0.5
output_ratio:
    - 0.2
n_samples:
    - 1000
    - 2000
    - 5000
    - 10000
    - 20000
    - 50000
    - 100000
