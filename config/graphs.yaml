graphs:
    A:
        nodes: [0, 1, 2, 3, 4]
        edges:
            - [0, 1]
            - [0, 2]
            - [1, 3]
            - [1, 4]
            - [2, 3]
            - [2, 4]
            - [1, 2]
            - [3, 4]
        targets: [3, 4]

    B:
        # Node 1 confounds two pairs resolved at different recursion depths:
        # (4,5) directly, and (2,3) separately. Node 0 confounds only (2,3).
        # Exercises dataRSE's known_parents (K) path: at the call resolving
        # V={2,3}, node 1 is already known (resolved while handling V={4,5})
        # and is a direct parent of both 2 and 3.
        nodes: [0, 1, 2, 3, 4, 5]
        edges:
            - [0, 2]
            - [0, 3]
            - [1, 2]
            - [1, 3]
            - [1, 4]
            - [1, 5]
            - [2, 3]
            - [2, 4]
            - [2, 5]
            - [3, 4]
            - [3, 5]
            - [4, 5]
        targets: [4, 5]

    C:
        nodes: [0, 1, 2, 3, 4, 5, 6]
        edges:
            - [0, 2]
            - [0, 3]
            - [0, 4]
            - [1, 2]
            - [1, 3]
            - [1, 4]
            - [2, 5]
            - [2, 6]
            - [3, 5]
            - [3, 6]
            - [4, 5]
            - [4, 6]
            - [5, 6]
        targets: [5, 6]

    D:
        nodes: [0, 1, 2, 3, 4, 5, 6]
        edges:
            - [0, 2]
            - [0, 3]
            - [0, 4]
            - [1, 2]
            - [1, 3]
            - [1, 4]
            - [2, 4]
            - [2, 5]
            - [2, 6]
            - [3, 4]
            - [3, 5]
            - [3, 6]
            - [4, 5]
            - [4, 6]
            - [5, 6]
        targets: [5, 6]

    E:
        # "Deep": a 3-level recursion, with a within-layer interaction edge
        # at *each* of the first two confounder layers (Graph D only has
        # one such layer). Starting from targets {6,7}: layer1 = {3,4,5}
        # confounds them, with the within-layer edges 3->5, 4->5; layer2 =
        # {1,2} confounds layer1, with the within-layer edge 1->2; layer3 =
        # {0} confounds layer2. Stress-tests dataRSE across more recursive
        # calls than any of A-D.
        nodes: [0, 1, 2, 3, 4, 5, 6, 7]
        edges:
            - [0, 1]
            - [0, 2]
            - [1, 2]
            - [1, 3]
            - [1, 4]
            - [1, 5]
            - [2, 3]
            - [2, 4]
            - [2, 5]
            - [3, 5]
            - [4, 5]
            - [3, 6]
            - [3, 7]
            - [4, 6]
            - [4, 7]
            - [5, 6]
            - [5, 7]
        targets: [6, 7]

    F:
        # "Wide": a genuine 4-way confounder set directly on the targets
        # (A-D have at most 3), confounded in turn by a 2-way set one level
        # up. Stress-tests collinearity_constraints with more simultaneous
        # pairwise non-collinearity constraints (C(4,2)=6 vs C(3,2)=3).
        nodes: [0, 1, 2, 3, 4, 5, 6, 7]
        edges:
            - [0, 2]
            - [0, 3]
            - [0, 4]
            - [0, 5]
            - [1, 2]
            - [1, 3]
            - [1, 4]
            - [1, 5]
            - [2, 6]
            - [2, 7]
            - [3, 6]
            - [3, 7]
            - [4, 6]
            - [4, 7]
            - [5, 6]
            - [5, 7]
        targets: [6, 7]

    G:
        # "Compound": combines F's 4-way width at the first level with B's
        # known-parents K mechanism. Node 1 is both a direct confounder of
        # the targets and a parent of its siblings 2, 3 (within-layer edges
        # 1->2, 1->3); node 0 then confounds only the subset {2,3}, so its
        # coefficient estimation must adjust for node 1 as a known parent,
        # exactly as in Graph B, but now alongside two additional, otherwise
        # independent confounders (node 4, and node 1 itself).
        nodes: [0, 1, 2, 3, 4, 5, 6]
        edges:
            - [0, 2]
            - [0, 3]
            - [1, 2]
            - [1, 3]
            - [1, 5]
            - [1, 6]
            - [2, 5]
            - [2, 6]
            - [3, 5]
            - [3, 6]
            - [4, 5]
            - [4, 6]
        targets: [5, 6]

    I:
        # shown as Graph H in the paper
        nodes: [0, 1, 2, 3, 4]
        edges:
            - [0, 2]
            - [0, 3]
            - [1, 2]
            - [1, 3]
            - [2, 3]
            - [2, 4]
            - [3, 4]
        targets: [3, 4]
